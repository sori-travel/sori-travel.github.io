<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:site_name" content="소리여행">
<meta property="og:title" content="소리여행 - 한국어로 듣는 해외 박물관 오디오 가이드">
<meta property="og:description" content="대영박물관, 루브르, 바티칸 등 해외 박물관과 명소를 한국어 해설로 들어요. 큰 글씨, 쉬운 화면.">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="소리여행">
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#16191f;--muted:#6b727d;--line:#e3e5ea;--a:#1f5f8b;--a2:#c2571a;--ok:#2f7d4f;--hl:#e3eef7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--fg:#e9ebee;--muted:#a3aab5;--line:#2f343c;--a:#7db8e0;--a2:#f0995f;--ok:#6cc08f;--hl:#23384a}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--fg:#e9ebee;--muted:#a3aab5;--line:#2f343c;--a:#7db8e0;--a2:#f0995f;--ok:#6cc08f;--hl:#23384a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 140px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:16px 0 8px}
.top .back{border:0;background:none;font-size:22px;padding:4px 8px 4px 0;color:var(--a)}
.top b{font-size:17px}
h1{font-size:24px;margin:20px 0 2px}
h2{font-size:15px;margin:18px 0 6px}
.sub{color:var(--muted);font-size:13px}
.note{margin:12px 0;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;width:100%;text-align:left}
.badge.tmp{background:#eceef2;color:#5a616c}
.card.soon{opacity:.62;cursor:default}.card.soon .thumb{display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--line)}
.badge.soon{background:#eceef2;color:#5a616c}
.look.miss .opts{margin-top:6px}
.thumb{width:64px;height:64px;border-radius:12px;flex:none;background:#ccd center/cover}
.grow{flex:1;min-width:0}
.grow b{display:block;font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:4px;background:#e2f2e8;color:#2f7d4f}
.hero{height:190px;margin:0 -16px 12px;background:#99a center/cover;position:relative}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 60%)}
.hero .tt{position:absolute;left:16px;bottom:14px;color:#fff;z-index:1}
.hero .tt b{font-size:24px;display:block;line-height:1.3}
.hero .bk{position:absolute;left:12px;top:12px;z-index:1;border:0;background:rgba(0,0,0,.4);color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;background:var(--a);color:#fff;text-align:center}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.vc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;text-align:left;font-size:13px}
.vc b{display:block;font-size:14px}
.vc span{color:var(--muted);font-size:12px}
.vc.on{border-color:var(--a);background:var(--hl)}
.vc .try{float:right;border:0;background:none;color:var(--a);font-size:12px;padding:0}
.stop{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;font-size:14px}
.stop .n{width:26px;height:26px;border-radius:50%;background:var(--hl);color:var(--a);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.stop.done .n{background:var(--ok);color:#fff}
.stop.cur{font-weight:700}.stop.cur .n{background:var(--a);color:#fff}
.stop .len{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.script{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:16px;line-height:1.85}
.script span{border-radius:4px;transition:background .2s;cursor:pointer}
.script span.on{background:var(--hl);color:var(--fg)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;width:0;background:var(--a)}
.player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.player .in{max-width:480px;margin:0 auto}
.ctrl{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:6px}
.ctrl button{border:0;background:none;font-size:15px;color:var(--muted)}
.ctrl .play{width:54px;height:54px;border-radius:50%;background:var(--a);color:#fff;font-size:20px}
.row2{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);gap:6px}
.row2 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.row2>span:last-child{flex:none;display:flex;align-items:center;white-space:nowrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;margin-left:4px;white-space:nowrap}
.pill.on{background:var(--a);color:#fff;border-color:var(--a)}
.fb{display:flex;gap:8px;align-items:center;margin:4px 0 12px;font-size:13px;color:var(--muted)}
.fb button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px}
.fb button.on{border-color:var(--a);background:var(--hl);color:var(--a);font-weight:700}
.survey{background:var(--card);border:1px solid var(--a2);border-radius:16px;padding:14px 16px;margin:14px 0}
.survey b{display:block;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.opts button.on{background:var(--a2);border-color:var(--a2);color:#fff}
textarea{width:100%;min-height:70px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:14px;background:var(--bg);color:var(--fg)}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--a);text-decoration:underline;padding:0;font-size:12px}
.badge.draft{background:#fbeedd;color:#9a4a12}
.badge.mine{background:var(--hl);color:var(--a)}
.price{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--a);white-space:nowrap}
.tabs{display:flex;gap:6px;margin:16px 0 4px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--a);border-color:var(--a);color:#fff}
.by{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:13px}
.by .av{width:38px;height:38px;border-radius:50%;background:var(--hl);color:var(--a);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.look{background:var(--hl);border-radius:14px;padding:10px 14px;margin:12px 0 0;font-size:15px;line-height:1.6}
.look small{display:block;font-size:12px;font-weight:700;color:var(--a);margin-bottom:2px}
.fld{display:block;margin:10px 0 0;font-size:13px;font-weight:700}
.fld input,.fld textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:15px;font-weight:400;background:var(--bg);color:var(--fg)}
.fld textarea{min-height:150px}
.ed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.ed .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.ed .hd .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:13px}
.cnt{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.sbtn{border:1px solid var(--a);background:none;color:var(--a);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--a);border:1px solid var(--a);margin-top:8px}
.steps{counter-reset:s;padding:0;margin:8px 0;list-style:none;font-size:13.5px}
.steps li{position:relative;padding-left:30px;margin:8px 0}
.bigsw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--a);border-radius:14px;padding:10px 14px;margin:12px 0;font-weight:700;width:100%;font-size:15px}
.bigsw .sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none}
.bigsw .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.bigsw.on .sw{background:var(--a)}.bigsw.on .sw::after{left:23px}
.course{border:2px solid var(--a2)}
.badge.course{background:var(--a2);color:#fff;border:0}
.from{font-size:11.5px;color:var(--muted);display:block;font-weight:400}
html{--fs:1}
.script{font-size:calc(16px * var(--fs))}
.script,.look,.sub{word-break:keep-all;overflow-wrap:break-word}
.script p{margin:0 0 .85em}.script p:last-child{margin-bottom:0}
.look{font-size:calc(15px * var(--fs))}
.stop{font-size:calc(14px * var(--fs))}
.setrow{display:flex;gap:8px;margin:12px 0}
.setrow .grp{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;font-weight:700;color:var(--fg)}
.setrow .grp button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;min-width:42px;height:36px;font-weight:700;font-size:15px}
.setrow .grp b{min-width:14px;text-align:center}
html.big .setrow .grp{font-size:16px}
html.big body{font-size:18px}
html.big h1{font-size:30px}
html.big h2{font-size:19px}
html.big .sub,html.big .note,html.big .by{font-size:16px}
html.big .card .grow b{font-size:19px}
html.big .thumb{width:80px;height:80px}
html.big .stop{font-size:calc(18px * var(--fs));padding:15px 2px}
html.big .stop .n{width:34px;height:34px;font-size:15px}
html.big .stop .len{font-size:14px}
html.big .script{font-size:calc(21px * var(--fs));line-height:1.9}
html.big .look{font-size:calc(19px * var(--fs))}
html.big .btn{font-size:19px;padding:17px}
html.big .player{padding-top:14px}
html.big .row2{font-size:15px}
html.big .pill{font-size:15px;padding:6px 14px}
html.big .ctrl{gap:18px}
html.big .ctrl button{font-size:19px}
html.big .ctrl .play{width:76px;height:76px;font-size:28px}
html.big #app{padding-bottom:190px}
html.big .opts button,html.big .fb button{font-size:16px;padding:9px 15px}
html.big .vc b{font-size:17px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--a);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* 앱 설치 칸(맨 위) */
.install{max-width:480px;margin:12px auto 0;padding:0 16px}
.install[hidden]{display:none}
.install .in{background:var(--card);border:1.5px solid var(--a);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.install p{margin:0;font-size:14px;line-height:1.55}
.install .go{min-height:54px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:700;font-size:16px}
:root[data-theme="dark"] .install .go{color:#14171b}
.install .no{align-self:flex-end;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;min-height:36px}
html.big .install p{font-size:17px}
html.big .install .go{font-size:19px;min-height:62px}
h3.grp{margin:22px 2px 8px;font-size:15px;color:var(--a)}
html.big h3.grp{font-size:18px}
.srch{position:relative;margin:14px 0 4px}
.srch input{width:100%;box-sizing:border-box;font-size:17px;padding:14px 46px 14px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:inherit}
.srch input:focus{outline:none;border-color:var(--a)}
.srch input::-webkit-search-cancel-button{display:none}
.srch button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;padding:8px 10px;color:inherit;opacity:.6}
html.big .srch input{font-size:21px;padding:17px 50px 17px 16px}
.setrow{flex-wrap:wrap}
.setrow .grp.fs{flex:0 0 auto;gap:6px}
.setrow .grp.pill{justify-content:center;white-space:nowrap;padding:6px 12px}
.setrow .grp.pill.on{background:var(--a);border-color:var(--a);color:#fff}
.bigsw{border-width:1px;border-color:var(--line);font-size:16px;padding:14px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.setb{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700}
.vnow{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);font-size:14px;padding:8px 2px;margin:2px 0}
.vnow b{color:var(--fg)}.vnow span{color:var(--a);font-weight:700;margin-left:4px}
.bk2{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;width:40px;height:40px;font-size:19px;flex:none}
html.big .setb,html.big .vnow{font-size:18px}
.rtb{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:1px;margin-left:4px;vertical-align:middle}
.rtb button{border:0;background:none;color:var(--a);font-size:13px;width:30px;height:28px;border-radius:999px}
.rtb button:active{background:var(--line)}
.rtb b{font-size:12.5px;min-width:34px;text-align:center}
html.big .rtb button{width:40px;height:36px;font-size:16px}html.big .rtb b{font-size:15px;min-width:44px}
.fzb{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;width:32px;height:30px;font-size:14px;font-weight:700;flex:none}
.fzp{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 10px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 -2px 12px rgba(0,0,0,.12);width:max-content}
.fzp[hidden]{display:none}
.fzp button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 16px;font-size:17px;font-weight:700}
.fzp b{font-size:17px;min-width:20px;text-align:center}
html.big .fzb{width:40px;height:36px;font-size:17px}
.row2 #gocur{cursor:pointer}
.gocur2{display:block;margin:0 auto 10px;border:none;background:var(--a);color:#fff;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.gocur2[hidden]{display:none}
.drwb{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;flex:none}
.drw{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35)}
.drw[hidden]{display:none}
.drwin{position:absolute;right:0;top:0;bottom:0;width:min(86vw,380px);background:var(--bg);overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:-4px 0 18px rgba(0,0,0,.2);animation:drwin .18s ease-out}
.drwh{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px;font-size:18px}
.drwh button{border:none;background:none;color:var(--fg);font-size:20px;padding:4px 8px}
@keyframes drwin{from{transform:translateX(100%)}to{transform:none}}
.freeb{background:var(--a);color:#fff;border-radius:12px;padding:12px 14px;margin:12px 0 8px;font-weight:700;line-height:1.5}.freeb small{display:block;font-weight:400;opacity:.9;margin-top:2px}.grpbox{border:1px dashed var(--a);border-radius:12px;padding:12px 14px;margin:14px 0 6px;line-height:1.55}.grpbox b{display:block;margin-bottom:4px}.grpbox button{margin-top:10px;width:100%;padding:11px;border-radius:10px;border:0;background:var(--a);color:#fff;font-size:inherit;font-weight:700;cursor:pointer}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.tile{position:relative;height:118px;border-radius:16px;overflow:hidden;border:0;padding:0;background:#3a4450;color:#fff;text-align:left}
.tile .ti{position:absolute;inset:0;background:#3a4450 center/cover;opacity:.8}
.tile .tt{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 9px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.tile b{display:block;font-size:17px;line-height:1.25}.tile small{font-size:12.5px;opacity:.9}
html.big .tile{height:140px}html.big .tile b{font-size:20px}
.ctop{display:flex;align-items:center;gap:8px;margin:14px 0 2px}.ctop b{font-size:20px}
.ctop .back{border:0;background:none;font-size:22px;padding:4px 8px 4px 0;color:var(--a);cursor:pointer}
.drwtab{position:fixed;right:0;top:42%;z-index:40;width:26px;height:72px;padding:0;border:0;border-radius:14px 0 0 14px;background:var(--a);color:#fff;font-size:24px;line-height:1;opacity:.88;box-shadow:-2px 0 10px rgba(0,0,0,.18)}
.drwtab.wig{animation:wig 1.1s ease-in-out 2}
@keyframes wig{0%,100%{transform:none}30%{transform:translateX(-12px)}60%{transform:none}}
.drwtip{position:fixed;right:34px;top:calc(42% + 18px);z-index:40;background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;padding:9px 12px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:opacity .4s}
.drwtip[hidden]{display:none}
html.big .drwtab{width:32px;height:88px;font-size:28px}
.dl{margin:-4px 0 14px}.dl .btn.ghost{margin-top:0}.dl .btn:disabled{opacity:.75}.dl .sub{margin-top:6px;font-size:12.5px}
.lnk{border:0;background:none;color:var(--a);text-decoration:underline;font-size:inherit;padding:0 2px}
.bktoast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;padding:10px 16px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.22);white-space:nowrap}
.bktoast[hidden]{display:none}
/* v31 (26-11-14): 아래 재생 막대(스포티파이, 지니처럼). 재생 화면 밖에서도 계속 들으며 둘러보기 */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.12);padding:0 0 env(safe-area-inset-bottom)}
.mini[hidden]{display:none}

<body>
<section class="install" id="install" hidden aria-label="앱 설치"><div class="in">
  <p id="inst-msg"></p>
  <button type="button" class="go" id="inst-go" hidden></button>
  <button type="button" class="no" id="inst-no">다음에 할게요</button>
</div></section>
<div id="app"></div>
<script>
const G = window.GUIDE || {voices:[], places:[]};
/* v30 (26-11-13): 사용자 결정 '여성만 디폴트로'. 남성은 말씀 앱 방식 재녹음 전까지 숨기고 옛 남성 녹음도 안 틂(크레딧 남으면 남성 녹음 뒤 HIDE 비움) */
/* 남성 기본 (26-11-14): 말씀 앱 방식 새 남성 녹음 공개. 남성 녹음이 있는 곳은 남성이 기본, 없는 곳은 여성.
   듣는 분이 직접 고른 목소리는 그대로. 여성 자리(gacrux)에는 다시 녹음한 곳부터 새 여성 목소리(Achernar)가 들어감 */
const HIDE = [];
const VOICES = G.voices.filter(v => !HIDE.includes(v.id)).sort((a, b) => (b.id === 'zuben') - (a.id === 'zuben'));
const SOON = (window.SOON || []).map(x => Object.assign({soon: true, stops: []}, x)); // v19 준비 중인 곳

/* ---------- 저장(이 기기에만) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('sori7_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sori7_'+k, JSON.stringify(v)); }catch(e){} }
};
let fb = store.get('fb', {}), survey = store.get('survey', {}), heard = store.get('heard', {}), prog = store.get('prog', {});
let mine = store.get('mine', []);   // 내가 만든 해설
const saveMine = () => store.set('mine', mine);
/* 반나절 코스: 원래 정거장(같은 음성)을 골라 이어 붙임 */
const COURSES = [{ id:'pkg', name:'바티칸 반나절 코스', city:'바티칸 박물관과 성 베드로 대성당', img:'images/stp.jpg', by:'소리여행 편집팀',
  intro:'패키지 여행처럼 바티칸 박물관과 성 베드로 대성당을 반나절에 도는 분을 위한 코스예요. 꼭 볼 17곳만 골라, 들을 거리는 모두 50분쯤이에요. 가이드 설명을 놓치셨어도 여기서 다시 들으실 수 있어요.',
  picks:[['vat',[0,1,2,7,8,9,10,11,12]],['stp',[0,4,5,6,7,8,9,10]]] }];
const COURSE_PLACES = COURSES.map(c => ({ id:c.id, name:c.name, city:c.city, img:c.img, by:c.by, intro:c.intro, course:true,
  stops: c.picks.flatMap(([pid, idx]) => { const src = G.places.find(p => p.id === pid); return src ? idx.map(i => Object.assign({from: src.name}, src.stops[i])) : []; }) }));
const ALL = () => COURSE_PLACES.concat(G.places); // v6: 직접 만든 해설(해설 팔기)은 숨김

/* 글씨 크기(5단계)와 밝은/어두운 화면 */
const FS = [0.85, 1, 1.15, 1.3, 1.5];
let fsI = store.get('fs', 1), theme = store.get('theme', '');
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const isDark = () => theme ? theme === 'dark' : !!(mq && mq.matches);
function applyLook(){
  const r = document.documentElement; r.style.setProperty('--fs', FS[fsI]);
  if (theme) r.setAttribute('data-theme', theme); else r.removeAttribute('data-theme');
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = isDark() ? '#14171b' : '#1f5f8b';
}
applyLook();
const setRow = () => `<div class="setrow"><div class="grp fs"><button id="fsm" aria-label="글씨 작게">가-</button><b id="fsv">${fsI+1}</b><button id="fsp" aria-label="글씨 크게">가+</button></div><button class="grp pill" id="setb2">⚙ 설정</button></div>`;
/* v31: 설정을 열어도 해설은 계속 나옴(아래 재생 막대). 목소리 미리 듣기를 누르면 그때 멈춤 */
function openSet(){ S.back = S.view; stopPre(); S.view = 'settings'; render(); }
function closeSet(){ stopPre(); S.view = S.back || 'home'; render(); }
const thmLabel = () => S.view === 'settings' ? `<span>어두운 화면</span><span class="sw"></span>` : (isDark() ? '☀ 밝게' : '🌙 어둡게');
function wireSet(){
  const fv = document.getElementById('fsv');
  const step = d => { fsI = Math.max(0, Math.min(FS.length - 1, fsI + d)); store.set('fs', fsI); applyLook(); if (fv) fv.textContent = fsI + 1; };
  const m = document.getElementById('fsm'), p = document.getElementById('fsp'), th = document.getElementById('thm');
  if (m) m.onclick = () => step(-1); if (p) p.onclick = () => step(1);
  const sb = document.getElementById('setb2'); if (sb) sb.onclick = openSet;
  if (th) th.onclick = () => { theme = isDark() ? 'light' : 'dark'; store.set('theme', theme); applyLook(); th.innerHTML = thmLabel(); if (S.view === 'settings') th.classList.toggle('on', isDark()); };
}

/* 큰 글씨 모드 */
let big = store.get('big', false) === true; // v23: 설정 화면에 큰 글씨 모드 다시 켬(v7에서 뺐던 것)
function applyBig(){ document.documentElement.classList.toggle('big', big); }
applyBig();
const bigSwitch = () => `<button class="bigsw ${big?'on':''}" id="bigsw"><span>큰 글씨 모드 <small style="font-weight:400;opacity:.75">(글씨, 버튼 크게)</small></span><span class="sw"></span></button>`;
function wireBig(){ const b = document.getElementById('bigsw'); if (b) b.onclick = () => {
  big = !big; store.set('big', big); applyBig();
  if (big && S.rate === 1){ S.rate = 0.9; store.set('rate', 0.9); setRate(); }
  if (big){ S.auto = true; store.set('auto', true); }
  render();
}; }

const RATES = [0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.5]; // v11_v2: 재생 속도는 ◀ ▶ 로 한 칸씩
const rateTxt = () => (S.rate === 1 ? '보통' : S.rate.toFixed(1) + '배');
function split(text){ return (String(text).match(/(?:[^.!?]|\.(?=\d))+[.!?]?/g) || [text]).map(s => s.trim()).filter(Boolean); }

/* ---------- 상태 ---------- */
let PICKED = store.get('voice', null) != null; // 듣는 분이 설정에서 목소리를 직접 고른 적이 있나
const S = { view:'home', place:null, stop:0, idx:0, playing:false, edit:null,
  rate: store.get('rate', 1), auto: store.get('auto', true),
  voice: store.get('voice', VOICES[0] && VOICES[0].id),
  miss: store.get('miss', 'sub') };  // v10: 고른 목소리가 없을 때 'sub'(녹음된 다른 목소리) 또는 'device'(폰 기본 음성)
const DEV = 'device';
if (S.voice !== DEV && !VOICES.find(v => v.id === S.voice) && VOICES[0]) S.voice = VOICES[0].id;
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* v31: S.place, S.stop = 지금 듣는 곳(재생 막대), S.sel = 장소 화면에서 보고 있는 곳. 둘러보는 동안 재생이 끊기지 않게 나눔 */
const P = () => ALL().find(p => p.id === S.place);
const PV = () => ALL().find(p => p.id === S.sel) || P();
const ev = (name, extra, pl) => { try { const p = pl || P();const o = p ? { place: p.id, place_name: p.name, country: p.grp || (p.course ? '코스' : '') } : {}; gtag('event', name, Object.assign(o, extra || {})); } catch (e) {} };
const key = (pid, i) => pid + ':' + i;
const V = () => VOICES.find(v => v.id === S.voice) || VOICES[0];
/* v10: 정거장마다 실제로 틀 목소리. null이면 폰 기본 음성으로 읽음
   - '폰 기본 음성'을 골랐으면 늘 폰 음성
   - 고른 목소리 녹음이 있으면 그것
   - 없으면 듣는 분이 고른 보기(S.miss)대로: 녹음된 다른 목소리(목록 첫 목소리 먼저) 또는 폰 음성
   - 녹음이 하나도 없는 곳은 폰 음성 */
const clipVid = st => {
  if (S.voice === DEV) return null;
  const a = st.audio || {};
  if (a[S.voice]) return S.voice;
  if (S.miss === DEV) return null;
  return a[VOICES[0].id] ? VOICES[0].id : (Object.keys(a)[0] || null);
};
const clip = (st, vid) => { const v = vid || clipVid(st); return v && st.audio ? st.audio[v] : null; };
const hasRec = st => !!(st.audio && Object.keys(st.audio).length);
const ready = p => p.custom || p.stops.every(hasRec);   // 모든 곳이 녹음돼 있나(아니면 '임시 음성' 표시)
const VN = id => id === DEV || !id ? '폰 기본 음성' : (VOICES.find(v => v.id === id) || V()).name;
/* v29 (26-11-13): 말씀 앱과 똑같은 기본 빠르기(말씀 앱 '보통' 0.85 x 남자 목소리 1.2). 녹음도 말씀 앱 방식으로 다시 함 */
const REC_SPEED = { zuben: 1.02, gacrux: 0.85 };
const recSpeed = vid => REC_SPEED[vid] || 0.85;
const secs = st => { const v = clipVid(st) || Object.keys(st.audio || {})[0], c = clip(st, v); return c ? Math.round(c.dur / recSpeed(v)) : Math.round(String(st.s).length / 7); }; // 들리는 길이로
const mmss = n => Math.floor(n / 60) + '분 ' + String(n % 60).padStart(2, '0') + '초';
const totalMin = p => Math.round(p.stops.reduce((a, s) => a + secs(s), 0) / 60);
const isTTS = () => { const p = P(); return !!(p && (p.custom || !clip(p.stops[S.stop]))); };

/* ---------- 들은 만큼 기록 ---------- */
function mark(f){
  const k = key(S.place, S.stop), old = prog[k] || 0;
  if (f > old + 0.04 || (f >= 0.999 && old < 0.999)){ prog[k] = Math.min(1, Math.round(f * 100) / 100); store.set('prog', prog); }
}

/* ---------- 음성(mp3) ---------- */
const au = new Audio(); au.preload = 'auto';
let loaded = '';
function setRate(){ const p = P(), st = p && p.stops[S.stop], r = S.rate * recSpeed(st ? clipVid(st) : S.voice); au.defaultPlaybackRate = r; au.playbackRate = r; try{ au.preservesPitch = true; }catch(e){} }
function loadStop(){
  if (isTTS()) return false;
  const c = clip(P().stops[S.stop]);
  if (!c) return false;
  if (loaded !== c.src){ au.src = c.src; loaded = c.src; }
  setRate();
  return true;
}
function startAt(idx){
  S.chime = false;
  if (isTTS()) return ttsStart(idx);
  const c = clip(P().stops[S.stop]);
  if (!c){ S.playing = false; paintPlayer(); alert('이 목소리의 음성이 아직 없어요. 다른 목소리를 골라 주세요.'); return; }
  loadStop();
  const t = S.resumeT != null && idx === S.idx ? S.resumeT : (c.sents[idx] || 0); S.resumeT = null;   // v32: 앱을 다시 열면 멈췄던 초부터
  const go = () => { try{ au.currentTime = t; }catch(e){} if (S.playing){ const pr = au.play(); if (pr) pr.catch(() => { S.playing = false; paintPlayer(); }); } };
  if (au.readyState >= 1) go(); else au.addEventListener('loadedmetadata', go, {once:true});
  S.idx = idx; paintPlayer();
}
au.addEventListener('timeupdate', () => {
  if (!P() || isTTS() || S.chime) return;
  const c = clip(P().stops[S.stop]); if (!c) return;
  let i = 0; for (let k = 0; k < c.sents.length; k++) if (au.currentTime + 0.05 >= c.sents[k]) i = k;
  if (i !== S.idx){ S.idx = i; if (S.view === 'player') paintScript(); saveLast(); }
  if (au.duration){
    const pg = document.getElementById('pg'); if (pg && S.view === 'player') pg.style.width = (au.currentTime / au.duration * 100) + '%';
    miniPg();
    if (S.playing) mark(au.currentTime / au.duration);
  }
});
au.addEventListener('ended', () => { if (S.chime){ const tr = S.chime; if (typeof tr === 'string' && S.playing){ S.chime = 1; au.src = tr; au.play().catch(() => { S.chime = false; startAt(0); }); return; }
  S.chime = false; if (S.playing) startAt(0); return; } if (!isTTS()) stopEnded(); });
au.addEventListener('pause', () => { if (!S.chime && !isTTS() && S.playing && au.paused && !au.ended && document.hidden === false && au.currentTime < (au.duration || 1e9) - 0.2){ S.playing = false; paintPlayer(); } });

/* ---------- 기기 음성(내가 만든 해설) ---------- */
const synth = window.speechSynthesis;
let ttsTok = 0;
function ttsStop(){ ttsTok++; try{ synth && synth.cancel(); }catch(e){} }
function ttsStart(idx){
  ttsStop();
  if (!synth){ S.playing = false; paintPlayer(); alert('이 폰에서는 기본 음성으로 읽기를 쓸 수 없어요. 녹음된 목소리를 골라 주세요.'); return; }
  S.idx = idx; paintPlayer();
  if (S.playing) ttsSpeak(idx, ttsTok);
}
function ttsSpeak(idx, tok){
  const sents = split(P().stops[S.stop].s);
  if (idx >= sents.length){ stopEnded(); return; }
  const u = new SpeechSynthesisUtterance(sents[idx]);
  u.lang = 'ko-KR'; u.rate = S.rate;
  u.onend = () => {
    if (tok !== ttsTok || !S.playing) return;
    S.idx = idx + 1; mark(S.idx / sents.length);
    const pg = document.getElementById('pg'); if (pg && S.view === 'player') pg.style.width = (S.idx / sents.length * 100) + '%';
    miniPg();
    if (S.idx >= sents.length) stopEnded(); else { paintScript(); ttsSpeak(S.idx, tok); }
  };
  synth.speak(u);
}

function stopEnded(){
  ev('stop_complete', { stop: S.stop + 1, stops: P().stops.length, last: S.stop === P().stops.length - 1 ? 1 : 0 });
  heard[key(S.place, S.stop)] = 1; store.set('heard', heard); mark(1);
  const n = P().stops.length;
  // v31: 다른 화면을 보는 중이면 그 화면은 그대로 두고 아래 막대만 바꿈
  const redraw = () => { if (S.view === 'player') render(); else paintMini(); };
  if (S.auto && S.stop < n - 1){ S.stop++; S.idx = 0; redraw(); playChime(); }
  else { S.playing = false; S.idx = 0; try { if (!isTTS()) au.currentTime = 0; } catch(e){} redraw(); saveLast(); }   // v32: 다 들은 곳은 처음으로 되돌려 막대에 남김
}
/* 다음 곳으로 넘어갈 때 띵동(v11). 녹음에 tr(띵동+제목)이 있으면 그것 */
function playChime(){
  const c = isTTS() ? null : clip(P().stops[S.stop]);
  S.chime = (c && c.tr) || true; loaded = ''; au.src = 'chime.wav'; au.playbackRate = 1;
  const pr = au.play(); if (pr) pr.catch(() => { S.chime = false; startAt(0); });
}
function toggle(){
  if (S.playing){ S.playing = false; au.pause(); ttsStop(); paintPlayer(); return; }
  S.playing = true; ev('guide_play', { stop: S.stop + 1, voice: isTTS() ? 'device' : S.voice });
  if (!isTTS() && loaded === (clip(P().stops[S.stop])||{}).src && au.currentTime > 0 && !au.ended){ setRate(); au.play().catch(() => { S.playing = false; paintPlayer(); }); paintPlayer(); }
  else startAt(S.idx);
}
/* stay: 재생 화면으로 옮기지 않음(잠금 화면, 재생 막대의 이전/다음) */
function go(i, stay){ document.body.style.overflow = ''; S.chime = false; S.resumeT = null; au.pause(); ttsStop(); S.stop = i; S.idx = 0; S.np = true; if (!stay) S.view = 'player'; if (S.view === 'player') render(); else paintMini(); if (S.playing) startAt(0); else loadStop(); }
function seek(d){
  const n = split(P().stops[S.stop].s).length;
  startAt(Math.min(n - 1, Math.max(0, S.idx + d)));
}
function halt(){ S.playing = false; au.pause(); ttsStop(); }
function reloadVoice(apply){
  const wasPlaying = S.playing, idx = S.idx;
  au.pause(); ttsStop(); apply(); loaded = '';
  if (S.view === 'player'){ render(); S.playing = wasPlaying; startAt(idx); }
  else { render(); if (S.np && P() && wasPlaying){ S.playing = true; startAt(idx); } } // v31: 설정에서 목소리를 바꿔도 듣던 곳 그대로 이어서
}
function pickVoice(id){
  if (id === S.voice) return;
  reloadVoice(() => { S.voice = id; store.set('voice', id); PICKED = true; });
}
function pickMiss(m){
  if (m === S.miss) return;
  reloadVoice(() => { S.miss = m; store.set('miss', m); });
}
/* 고른 목소리 녹음이 이곳에 없을 때 보여 줄 보기 */
function missBox(st){
  if (S.voice === DEV || (st.audio && st.audio[S.voice])) return '';
  if (!PICKED && hasRec(st)) return ''; // 기본 목소리(남성)가 없는 곳은 묻지 않고 여성으로
  const subId = st.audio && st.audio[VOICES[0].id] ? VOICES[0].id : Object.keys(st.audio || {})[0];
  const opt = (m, label) => `<button data-miss="${m}" class="${S.miss===m || (m===DEV && !subId) ? 'on' : ''}">${esc(label)}</button>`;

const pre = new Audio(); let preId = '';
function tryVoice(id){
  halt();
  if (id === DEV){
    if (preId === DEV){ preId = ''; paintTry(); return; }
    pre.pause(); if (!synth){ alert('이 폰에서는 기본 음성을 쓸 수 없어요.'); return; }
    const u = new SpeechSynthesisUtterance(split(G.places[0].stops[0].s).slice(0, 2).join(' '));
    u.lang = 'ko-KR'; u.rate = S.rate; u.onend = () => { if (preId === DEV){ preId = ''; paintTry(); } };
    preId = DEV; paintTry(); synth.speak(u); return;
  }
  if (preId === id && !pre.paused){ pre.pause(); preId = ''; paintTry(); return; }
  const p0 = G.places.find(p => p.stops && p.stops[0] && p.stops[0].audio && p.stops[0].audio[id]) || G.places[0];
  const c = clip(p0.stops[0], id); if (!c) return;
  pre.src = c.src; pre.currentTime = 0; pre.play().catch(()=>{}); preId = id; paintTry();
}
pre.addEventListener('ended', () => { preId = ''; paintTry(); });
setInterval(() => { if (preId && pre.currentTime > 9){ pre.pause(); preId = ''; paintTry(); } }, 300);

    <div class="note">시험판이라 실제 판매와 정산은 아직 없어요. 쓴 내용은 이 기기에만 저장돼요. 판매 신청 버튼을 누르면 내용이 복사되니 카톡으로 보내 주세요.</div>
    <button class="btn" id="new">새 해설 만들기</button>
    ${mine.length ? `<h2>내가 만든 해설</h2>${ALL().filter(p => p.custom).map(card).join('')}` : ''}`;
  wireTabs();
  app.querySelector('#new').onclick = () => { const g = newGuide(); S.edit = g.id; S.view = 'edit'; render(); };
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.edit = b.dataset.p; S.view = 'edit'; render(); });
}
function editor(){
  const g = M(); if (!g){ S.view = 'studio'; return render(); }
  const tot = g.stops.reduce((a, s) => a + s.s.length, 0);
  app.innerHTML = `
    <div class="top"><button class="back" id="bk" aria-label="뒤로">←</button><b>해설 만들기</b></div>
    <label class="fld">장소 이름<input id="g_name" value="${esc(g.name)}" placeholder="예: 오르세 미술관"></label>
    <label class="fld">도시<input id="g_city" value="${esc(g.city)}" placeholder="예: 프랑스 파리"></label>
    <label class="fld">한두 줄 소개<input id="g_intro" value="${esc(g.intro)}" placeholder="어떤 사람에게, 무엇을 들려주는 해설인가요?"></label>
    <h2>정거장 ${g.stops.length}곳 | 모두 ${tot.toLocaleString()}자, 약 ${mmss(Math.round(tot / 7))}</h2>
    ${g.stops.map((s, i) => `<div class="ed" data-k="${i}">
      <div class="hd">${i+1}번째 곳 <button class="x" data-del="${i}">지우기</button></div>
      <label class="fld">제목<input data-f="t" value="${esc(s.t)}" placeholder="예: 고흐의 자화상"></label>
      <label class="fld">지금 찾을 것 (한 줄)<input data-f="l" value="${esc(s.l)}" placeholder="예: 소용돌이치는 푸른 배경을 찾아보세요."></label>
      <label class="fld">해설<textarea data-f="s" placeholder="듣는 사람에게 말하듯 써 주세요.">${esc(s.s)}</textarea></label>
      <div class="cnt"><span data-c="${i}">${s.s.length.toLocaleString()}자, 약 ${mmss(Math.round(s.s.length / 7))}</span><button class="sbtn" data-say="${i}">▶ 미리 듣기</button></div>
    </div>`).join('')}
    <button class="btn ghost" id="add">+ 정거장 추가</button>
    <div class="survey" id="cs">
      <b>판매 희망가 (가이드 하나)</b>${opts('sp', SPRICE, g.price)}
      <b style="margin-top:12px">팔릴 때 몇 퍼센트를 받으면 해 보시겠어요?</b>${opts('sh', SHARE, g.share)}
      <b style="margin-top:12px">글로 해설을 쓰는 일, 어떠셨어요?</b>${opts('ea', EASE, g.ease)}
      <b style="margin-top:12px">나는 어떤 사람에 가까워요?</b>${opts('wh', WHO, g.who)}
      <textarea id="g_memo" placeholder="이런 기능이 있으면 좋겠다, 이건 걱정된다">${esc(g.memo||'')}</textarea>
    </div>
    <button class="btn" id="listen">처음부터 들어 보기</button>
    <button class="btn ghost" id="send">판매 신청 내용 복사하기</button>
    <button class="btn ghost" id="rm" style="color:var(--muted);border-color:var(--line)">이 해설 지우기</button>`;
  const save = () => saveMine();
  app.querySelector('#bk').onclick = () => { ttsStop(); S.view = 'studio'; render(); };
  ['name', 'city', 'intro'].forEach(f => app.querySelector('#g_' + f).oninput = (e) => { g[f] = e.target.value; save(); });
  app.querySelector('#g_memo').oninput = (e) => { g.memo = e.target.value; save(); };
  app.querySelectorAll('.ed').forEach(box => {
    const i = +box.dataset.k;
    box.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => {
      g.stops[i][inp.dataset.f] = inp.value; save();
      if (inp.dataset.f === 's') box.querySelector('[data-c]').textContent = `${inp.value.length.toLocaleString()}자, 약 ${mmss(Math.round(inp.value.length / 7))}`;
    });
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const i = +b.dataset.del;
    if (g.stops.length === 1){ g.stops[0] = {t:'', l:'', s:''}; }
    else if (!confirm((i+1) + '번째 곳을 지울까요?')) return; else g.stops.splice(i, 1);
    save(); render();
  });
  app.querySelector('#add').onclick = () => { g.stops.push({t:'', l:'', s:''}); save(); render(); window.scrollTo(0, document.body.scrollHeight); };
  app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => {
    const i = +b.dataset.say, txt = g.stops[i].s.trim();
    if (!synth){ alert('이 기기에서는 미리 듣기를 쓸 수 없어요.'); return; }
    if (b.textContent.includes('멈춤')){ ttsStop(); b.textContent = '▶ 미리 듣기'; return; }
    if (!txt){ alert('해설을 먼저 써 주세요.'); return; }
    ttsStop(); app.querySelectorAll('[data-say]').forEach(x => x.textContent = '▶ 미리 듣기');
    const tok = ttsTok, u = new SpeechSynthesisUtterance(txt); u.lang = 'ko-KR'; u.rate = S.rate;
    u.onend = () => { if (tok === ttsTok) b.textContent = '▶ 미리 듣기'; };
    b.textContent = '■ 멈춤'; synth.speak(u);
  });
  const cs = app.querySelector('#cs');
  wireOne(cs, 'sp', g, 'price', save); wireOne(cs, 'sh', g, 'share', save); wireOne(cs, 'ea', g, 'ease', save); wireOne(cs, 'wh', g, 'who', save);
  app.querySelector('#listen').onclick = () => {
    const ok = g.stops.filter(s => s.s.trim());
    if (!ok.length){ alert('해설을 한 곳 이상 써 주세요.'); return; }
    ttsStop(); S.sel = g.id; S.view = 'place'; render();
  };
  app.querySelector('#send').onclick = () => {
    const ok = g.stops.filter(s => s.s.trim());
    if (!g.name.trim() || !ok.length){ alert('장소 이름과 해설 한 곳 이상이 필요해요.'); return; }
    const lines = ['[소리여행 판매 신청]', `장소: ${g.name}`, `도시: ${g.city}`, `소개: ${g.intro}`,
      `희망가: ${g.price||'응답 없음'} | 받고 싶은 비율: ${g.share||'응답 없음'} | 쓰기 난이도: ${g.ease||'응답 없음'} | 나는: ${g.who||'응답 없음'}`];
    if (g.memo) lines.push(`의견: ${g.memo}`);
    lines.push(`정거장 ${ok.length}곳, ${ok.reduce((a, s) => a + s.s.length, 0)}자`, '');
    ok.forEach((s, i) => { lines.push(`## ${i+1}. ${s.t}`); if (s.l) lines.push(`(찾을 것) ${s.l}`); lines.push(s.s, ''); });
    copyText(lines.join('\n'), 'send', '복사했어요. 카톡으로 보내 주세요');
  };
  app.querySelector('#rm').onclick = () => {
    if (!confirm('이 해설을 지울까요? 되돌릴 수 없어요.')) return;
    mine = mine.filter(m => m.id !== g.id); saveMine(); S.view = 'studio'; render();
  };
}
render();
</script>
<script>
/* 앱 설치: 크롬이 설치 신호를 주면 큰 버튼, 카카오톡 안이면 크롬으로 열기, 아이폰은 방법 안내 */
(function () {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const ua = navigator.userAgent, box = document.getElementById("install"), msg = document.getElementById("inst-msg"), go = document.getElementById("inst-go");
  const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let hide = false; try { hide = localStorage.getItem("sori_installHide") === "1"; } catch (e) {}
  if (installed) return;
  const show = (text, btn, fn) => {
    if (hide) return;
    msg.textContent = text; go.hidden = !btn;
    if (btn) { go.textContent = btn; go.onclick = fn; }
    box.hidden = false;
  };
  document.getElementById("inst-no").onclick = () => { box.hidden = true; try { localStorage.setItem("sori_installHide", "1"); } catch (e) {} };
  const android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (/KAKAOTALK/i.test(ua)) {
    const ext = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href.split("#")[0]);
    let tried = false; try { tried = sessionStorage.getItem("sori_kakaoExt") === "1"; sessionStorage.setItem("sori_kakaoExt", "1"); } catch (e) {}
    if (!tried) setTimeout(() => { location.href = ext; }, 300);   // v10: 카톡이면 바로 바깥 브라우저로
    hide = false;                                                   // 카톡 안에서는 늘 보임
    const name = android ? "크롬" : "사파리";
    show(android
      ? "카카오톡 안에서는 소리가 끊기기 쉽고 바탕화면에 앱을 둘 수 없어요. 아래 버튼을 눌러 크롬에서 열어 주세요. 버튼이 안 되면 오른쪽 위 ⋮ 에서 '다른 브라우저로 열기'를 눌러 주세요."
      : "카카오톡 안에서는 소리가 끊기기 쉽고 바탕화면에 앱을 둘 수 없어요. 아래 버튼을 눌러 사파리에서 열어 주세요. 버튼이 안 되면 오른쪽 아래 ⋯ 에서 '다른 브라우저로 열기'를 눌러 주세요.",
      "📲 " + name + "에서 열기", () => { location.href = ext; });
    return;
  }
  if (/NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua)) {
    show("이 앱 안에서는 설치할 수 없어요. 메뉴에서 '다른 브라우저로 열기'를 눌러 크롬이나 사파리에서 열어 주세요.");
    return;
  }
  if (ios) { show("휴대폰 바탕화면에 소리여행 앱을 두려면: 사파리 아래쪽 공유 버튼 ⬆ 을 누르고 '홈 화면에 추가'를 눌러 주세요."); return; }
  let got = false;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); got = true;
    show("휴대폰 바탕화면에 소리여행 앱을 놓아 두면 다음부터 한 번에 열 수 있어요.", "📲 바탕화면에 앱 설치하기", async () => {
      e.prompt(); const r = await e.userChoice; if (r.outcome === "accepted") box.hidden = true;
    });
  });
  window.addEventListener("appinstalled", () => { box.hidden = true; });
  if (android) setTimeout(() => {
    if (!got) show("휴대폰 바탕화면에 앱처럼 두려면: 오른쪽 위 점 세 개(⋮) 메뉴에서 '홈 화면에 추가' 또는 '앱 설치'를 눌러 주세요. 삼성 인터넷은 아래쪽 메뉴(≡)에서 '현재 페이지 추가', '홈 화면'을 눌러 주세요.");
  }, 4000);
})();
</script>
